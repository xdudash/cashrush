# Облачная сборка iOS-приложения Cash Rush и отправка в TestFlight.
# Работает без Mac: всё собирается на macOS-машине Codemagic.
#
# Что нужно сделать один раз (подробности в README.md):
#  1. В Codemagic: Teams → Integrations → App Store Connect → добавить API-ключ
#     и назвать его так же, как указано ниже в integrations.app_store_connect.
#  2. (папка ios/ уже в репозитории, её заново не создаём)
#  2. В Apple Developer создать Bundle ID = значение BUNDLE_ID ниже.
#  3. В App Store Connect создать приложение с этим Bundle ID.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic   # имя API-ключа в настройках Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.goapps.cashrush
        TEAM_ID: 6TU82NKL53
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: App icon
        script: dart run flutter_launcher_icons
      - name: Pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Key diagnostics
        script: |
          python3 - <<'PY'
          import os
          k = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          print('raw length:', len(k), 'lines:', len(k.splitlines()), 'has literal backslash-n:', '\\n' in k)
          print('line lengths:', [len(l) for l in k.splitlines()][:10])
          PY
      - name: Set up code signing (Codemagic CLI)
        script: |
          keychain initialize
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create \
            --certificate-key @file:/tmp/cert_key
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

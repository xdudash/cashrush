# Облачная сборка iOS-приложения Cash Rush и отправка в TestFlight.
# Работает без Mac: всё собирается на macOS-машине Codemagic.
#
# Что нужно сделать один раз (подробности в README.md):
#  1. В Codemagic: Teams → Integrations → App Store Connect → добавить API-ключ
#     и назвать его так же, как указано ниже в integrations.app_store_connect.
#  2. (папка ios/ уже в репозитории, её заново не создаём)
#  2. В Apple Developer создать Bundle ID = значение BUNDLE_ID ниже.
#  3. В App Store Connect создать приложение с этим Bundle ID.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic   # имя API-ключа в настройках Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.goapps.cashrush
        TEAM_ID: 6TU82NKL53
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: App icon
        script: dart run flutter_launcher_icons
      - name: Pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build Flutter iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 --build-number=$BUILD_NUMBER
      - name: Archive and export with automatic signing (App Store Connect API key)
        script: |
          set -e
          KEY=/tmp/AuthKey.p8
          python3 - <<'PY'
          import os, re, textwrap
          k = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '').replace('\\n', '\n')
          body = re.sub(r'-----[A-Z ]+-----|\s', '', k)
          print('key body chars:', len(body))
          print('key id set:', bool(os.environ.get('APP_STORE_CONNECT_KEY_IDENTIFIER')), 'issuer set:', bool(os.environ.get('APP_STORE_CONNECT_ISSUER_ID')))
          open('/tmp/AuthKey.p8', 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n')
          PY
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID"
          ARCHIVE=$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic $AUTH archive
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist $AUTH
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
